# Magic Desk image: bank 0 = loader, banks 1-7 = the program, 64 KB in all
MEMORY {
    BANK0: start = $8000, size = $2000, fill = yes, fillval = $FF, file = %O;
    RAMC:  start = $C000, size = $0100;
    BANKS: start = $0000, size = $E000, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
    HEADER:  load = BANK0, type = ro;
    CODE:    load = BANK0, type = ro;
    COPIER:  load = BANK0, run = RAMC, type = ro, define = yes;
    PAYLOAD: load = BANKS, type = ro;
}
