# The cartridge's code block: 2 KB of ROM at __BLOCK__. The font and the test run from RAM.
SYMBOLS {
    __BLOCK__: type = weak, value = $8000;
}
MEMORY {
    BLOCK:   file = %O, start = __BLOCK__, size = $0800, fill = yes, fillval = $FF;
    FONTRAM: file = "", start = $0800, size = $0200;
    PROGRAM: file = "", start = $0A00, size = $0600;
}
SEGMENTS {
    HEADER:  load = BLOCK, type = ro, optional = yes;
    STUB:    load = BLOCK, type = ro;
    PROG:    load = BLOCK, run = PROGRAM, type = ro, define = yes;
    FONT:    load = BLOCK, run = FONTRAM, type = ro, define = yes;
    VECTORS: load = BLOCK, type = ro, offset = $07FA, optional = yes;
}
