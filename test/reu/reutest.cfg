# C128 program at the start of BASIC; ld65 fails if it grows into the test buffers at $3000
MEMORY {
    LOADADDR: file = %O, start = $1BFF, size = 2;
    MAIN:     file = %O, start = $1C01, size = $3000 - $1C01;
}
SEGMENTS {
    LOADADDR: load = LOADADDR, type = ro;
    CODE:     load = MAIN,     type = rw;
}
